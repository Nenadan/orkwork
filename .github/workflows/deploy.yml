name: Deploy to production

on:
  push:
    branches: [main]

# Neophodno za OIDC - dozvoljava workflow-u da zatrazi identity token od GitHub-a
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: orkwork-react/package-lock.json

      - name: Install dependencies
        working-directory: orkwork-react
        run: npm ci

      - name: Build
        working-directory: orkwork-react
        run: npm run build

      - name: DEBUG - print OIDC token claims (privremeno, obrisati posle)
        run: |
          curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | \
          python3 -c "
          import sys, json, base64
          token = json.load(sys.stdin)['value']
          payload = token.split('.')[1]
          padded = payload + '=' * (-len(payload) % 4)
          print(json.dumps(json.loads(base64.urlsafe_b64decode(padded)), indent=2))
          "

      - name: Configure AWS credentials (OIDC, bez trajnih kljuceva)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::019233111011:role/GitHub_Deploy_Custom_Role
          aws-region: eu-central-1

      - name: Upload to S3
        run: aws s3 sync orkwork-react/dist/ s3://orkwork.rs --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E1013XFH3XJYW6 --paths "/*"